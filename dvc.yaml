stages:
  prepare:
    cmd: python prepare.py
    deps:
      - prepare.py
      - data/iris.csv
    params:
      - prepare
    outs:
      - data/prepared
  train:
    cmd: python train.py
    deps:
      - train.py
      - data/prepared
    params:
      - train
    outs:
      - models/model.pkl
  evaluate:
    cmd: python evaluate.py
    deps:
      - evaluate.py
      - models/model.pkl
      - data/prepared/test.csv
    metrics:
      - metrics.json:
          cache: false